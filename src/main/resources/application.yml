spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: sports-booking

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

app:
  payment:
    settlement:
      grace: ${PAYMENT_SETTLEMENT_GRACE:2m}
    inbox:
      enabled: ${PAYMENT_INBOX_ENABLED:true}
      poll-interval: ${PAYMENT_INBOX_POLL_INTERVAL:1s}
      batch-size: 25
      lease-duration: 60s
      retry-delay: 15s
      max-attempts: 8
    sepay:
      enabled: ${SEPAY_ENABLED:false}
      environment: ${SEPAY_ENVIRONMENT:SANDBOX}
      merchant-id: ${SEPAY_MERCHANT_ID:}
      secret-key: ${SEPAY_SECRET_KEY:}
      success-url: ${SEPAY_SUCCESS_URL:}
      error-url: ${SEPAY_ERROR_URL:}
      cancel-url: ${SEPAY_CANCEL_URL:}
      transaction-zone-id: ${SEPAY_TRANSACTION_ZONE_ID:Asia/Ho_Chi_Minh}

  booking:
    zone-id: ${BOOKING_ZONE_ID:Asia/Ho_Chi_Minh}
    hold:
      duration: ${BOOKING_HOLD_DURATION:10m}
      lock-ttl: ${BOOKING_LOCK_TTL:30s}
      expiry-poll-interval: ${BOOKING_EXPIRY_POLL_INTERVAL:15s}
      expiry-enabled: ${BOOKING_EXPIRY_ENABLED:true}

  cache:
    user-details-ttl: ${USER_DETAILS_CACHE_TTL:5m}

  outbox:
    poll-interval: 1s
    batch-size: 25
    max-retries: 10
    relay-enabled: true

  rabbitmq:
    publisher-confirm-timeout: 5s

  jwt:
    secret-key: ${JWT_SECRET_ACCESS_TOKEN}
    refresh-secret-key: ${JWT_SECRET_REFRESH_TOKEN}
    expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}
    verify-email-path: ${APP_FRONTEND_VERIFY_EMAIL_PATH:/verify-email}
    login-path: ${APP_FRONTEND_LOGIN_PATH:/login}

  auth:
    verification-token-ttl: 24h

    otp:
      length: 6
      ttl: 10m
      max-attempts: 5

  sendgrid:
    api-key: ${SENDGRID_API_KEY:}
    from-email: ${SENDGRID_FROM_EMAIL:}
    from-name: ${SENDGRID_FROM_NAME:Sports Booking}

  storage:
    r2:
      enabled: ${R2_ENABLED:false}
      account-id: ${R2_ACCOUNT_ID:}
      endpoint: ${R2_ENDPOINT:}
      bucket-name: ${R2_BUCKET_NAME:}
      access-key: ${R2_ACCESS_KEY_ID:}
      secret-key: ${R2_SECRET_ACCESS_KEY:}
      public-url: ${R2_PUBLIC_URL:}
