spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sports_booking_dev}
    username: ${DB_USERNAME:sports}
    password: ${DB_PASSWORD:sports}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      timeout: 3s

      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:sports}
    password: ${RABBITMQ_PASSWORD:sports}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}

    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}

    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        concurrency: 1
        max-concurrency: 5

logging:
  level:
    root: INFO
    dev.booking.sports: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG