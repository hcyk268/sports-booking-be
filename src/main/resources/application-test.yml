spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:postgresql://${DB_TEST_HOST:${DB_HOST:localhost}}:${DB_TEST_PORT:${DB_PORT:5432}}/${DB_TEST_NAME:sports_booking_test}
    username: ${DB_TEST_USERNAME:${DB_USERNAME:sports}}
    password: ${DB_TEST_PASSWORD:${DB_PASSWORD:sports}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_TEST_HOST:${REDIS_HOST:localhost}}
      port: ${REDIS_TEST_PORT:${REDIS_PORT:6379}}
      database: ${REDIS_TEST_DATABASE:1}
      username: ${REDIS_TEST_USERNAME:${REDIS_USERNAME:}}
      password: ${REDIS_TEST_PASSWORD:${REDIS_PASSWORD:}}
      timeout: 3s

  rabbitmq:
    host: ${RABBITMQ_TEST_HOST:${RABBITMQ_HOST:localhost}}
    port: ${RABBITMQ_TEST_PORT:${RABBITMQ_PORT:5672}}
    username: ${RABBITMQ_TEST_USERNAME:${RABBITMQ_USERNAME:sports}}
    password: ${RABBITMQ_TEST_PASSWORD:${RABBITMQ_PASSWORD:sports}}
    virtual-host: ${RABBITMQ_TEST_VIRTUAL_HOST:${RABBITMQ_VIRTUAL_HOST:/}}

    listener:
      simple:
        auto-startup: false

app:
  outbox:
    relay-enabled: false

  jwt:
    secret-key: test-access-token-secret-key-sports-booking-hs256-0123456789
    refresh-secret-key: test-refresh-token-secret-key-sports-booking-hs256-9876543210

  sendgrid:
    api-key: test-sendgrid-api-key-not-used-in-tests
    from-email: noreply@test.sports-booking.local
    from-name: Sports Booking Test

  frontend:
    base-url: http://localhost:3000
    verify-email-path: /verify-email
    login-path: /login

logging:
  level:
    root: WARN
    dev.booking.sports: INFO